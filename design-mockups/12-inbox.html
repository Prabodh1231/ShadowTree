<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShadowTree · Inbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="data.js"></script>
<script src="kit.js"></script>
<style>
/* Inbox: everyone already knows how to triage mail. Folders are labels, files are messages,
   "not sure where this goes" is unread, the attachment is the real file on disk. */
:root{--bg:#f4f7f5;--paper:#fff;--ink:#1c2a25;--mute:#62736c;--line:#dfe7e3;--pine:#1b6b52;--sel:#d9efe5;--hov:#eef4f1;--pii:#b3245a}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:14px/1.4 "Plus Jakarta Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.app{display:grid;grid-template-rows:64px 1fr;height:100vh}
.top{display:flex;align-items:center;gap:20px;padding:0 18px}
.brand{display:flex;align-items:center;gap:10px;width:226px;font-weight:700;font-size:19px;letter-spacing:-.02em}
.brand .ic{color:var(--pine)}
.search{flex:1;max-width:760px;display:flex;align-items:center;gap:12px;height:46px;background:#e6eeea;border-radius:24px;padding:0 18px;transition:.15s}
.search:focus-within{background:var(--paper);box-shadow:0 1px 8px #1c2a2526}
.search input{flex:1;border:0;outline:0;background:none;font:inherit;font-size:15px}
.search .ic{color:var(--mute)}
.top .r{margin-left:auto;display:flex;align-items:center;gap:10px}
.pill{display:flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line);background:var(--paper);font-weight:500}
.pill:hover{background:var(--hov)}
.seg{display:inline-flex;background:#e6eeea;border-radius:18px;padding:3px}
.seg button{padding:6px 14px;border-radius:15px;font-weight:500;font-size:13px}
.seg button[aria-pressed=true]{background:var(--paper);box-shadow:0 1px 3px #0002;color:var(--pine);font-weight:700}
.main{display:grid;grid-template-columns:244px 540px 1fr;min-height:0;gap:0}
/* side */
.side{padding:6px 12px;overflow:auto}
.compose{display:flex;align-items:center;gap:12px;height:54px;padding:0 24px;border-radius:16px;background:#c3e8d7;font-weight:600;margin:6px 0 14px;box-shadow:0 1px 2px #0002}
.compose:hover{box-shadow:0 2px 8px #1b6b5233}
.side .it{display:flex;align-items:center;gap:14px;width:100%;height:34px;padding:0 14px;border-radius:0 17px 17px 0;margin-left:-12px;padding-left:26px;text-align:left}
.side .it:hover{background:var(--hov)}
.side .it[aria-current=true]{background:var(--sel);font-weight:700}
.side .n{margin-left:auto;font-size:12.5px;color:var(--mute)}
.side h3{font-size:13px;font-weight:600;color:var(--mute);padding:16px 0 6px 2px}
.dot{width:12px;height:12px;border-radius:3px;flex:none}
.side .disk{margin-top:18px;padding:12px;border-radius:12px;background:#e9f1ed;font-size:12.5px;color:var(--mute);line-height:1.45}
.side .disk b{display:block;color:var(--ink);margin-bottom:2px}
/* list */
.listw{background:var(--paper);border-radius:16px 0 0 0;display:flex;flex-direction:column;min-width:0;border:1px solid var(--line);border-right:0;margin-top:2px}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{padding:13px 18px;font-weight:500;color:var(--mute);border-bottom:3px solid transparent;display:flex;gap:8px;align-items:center}
.tabs button[aria-selected=true]{color:var(--pine);border-color:var(--pine);font-weight:700}
.tools{display:flex;align-items:center;gap:6px;padding:6px 14px;border-bottom:1px solid var(--line);color:var(--mute);font-size:13px}
.tools .ic{margin:0 6px}
.tools .cnt{margin-left:auto}
.rows{overflow:auto;flex:1}
.m{display:grid;grid-template-columns:22px 150px 1fr 54px;gap:12px;align-items:center;padding:0 18px;height:52px;border-bottom:1px solid var(--line);cursor:pointer}
.m:hover{background:var(--hov)}
.m[aria-selected=true]{background:var(--sel)}
.m:focus-visible{outline:2px solid var(--pine);outline-offset:-2px}
.cb{width:16px;height:16px;border:2px solid #9bb0a7;border-radius:3px}
.fr{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:8px}
.sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mute)}
.sub b{color:var(--ink);font-weight:500}
.m.unread .fr,.m.unread .sub b{font-weight:700}
.m .t{font-size:12.5px;text-align:right;color:var(--mute);font-variant-numeric:tabular-nums}
.lbl{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:5px;margin-right:6px;color:#fff;vertical-align:1px}
b.hit{background:#fde68a;border-radius:2px;font-weight:inherit;color:inherit}
.empty{padding:60px 30px;text-align:center;color:var(--mute)}
/* reading */
.read{background:var(--paper);overflow:auto;border:1px solid var(--line);margin-top:2px;border-radius:0 16px 0 0}
.rd{padding:22px 34px 40px;max-width:820px}
.rd h1{font-size:23px;line-height:1.25;font-weight:600;letter-spacing:-.01em;display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.rd h1 .lbl{font-size:12px;margin:0;padding:3px 9px;border-radius:6px;font-weight:600;background:#e6eeea;color:var(--ink)}
.who{display:flex;align-items:center;gap:14px;margin:18px 0 16px}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:17px}
.who b{display:block}.who span{color:var(--mute);font-size:13px}
.who .acts{margin-left:auto;display:flex;gap:2px}
.who .acts button{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--mute)}
.who .acts button:hover{background:var(--hov)}
.banner{display:flex;gap:14px;align-items:center;background:#fff4d6;border:1px solid #f1d98d;border-radius:12px;padding:12px 16px;margin-bottom:18px;font-size:13.5px}
.banner .ic{color:#9a6a00}
.banner div{flex:1}
.btn{height:34px;padding:0 16px;border-radius:17px;border:1px solid #c9d6d0;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:8px;background:var(--paper)}
.btn:hover{background:var(--hov)}
.btn.p{background:var(--pine);border-color:var(--pine);color:#fff}.btn.p:hover{background:#14563f}
.sum{border-left:3px solid var(--pine);padding:4px 0 4px 16px;margin-bottom:18px;color:#34443e}
.sum small{display:block;color:var(--mute);font-size:12px;margin-bottom:2px}
.txt{font:14.5px/1.7 "Plus Jakarta Sans";white-space:pre-wrap;word-break:break-word}
mark.pii{padding:1px 5px;border-radius:4px;font-size:13px}
mark.pii.r{background:#1c2a25;color:#fff;font-family:Consolas,monospace;font-size:12.5px}
mark.pii.o{background:#fbe0ea;color:var(--pii)}
.att{display:flex;align-items:center;gap:14px;margin-top:28px;border:1px solid var(--line);border-radius:12px;padding:12px 16px;max-width:480px}
.att .ico{width:42px;height:42px;border-radius:8px;background:#e6eeea;display:grid;place-items:center;color:var(--pine)}
.att b{display:block;font-weight:600}.att span{font-size:12.5px;color:var(--mute)}
.att .btn{margin-left:auto}
.tg{display:flex;gap:6px;flex-wrap:wrap;margin-top:18px}
.tg span{font-size:12px;padding:3px 10px;border-radius:12px;background:#e6eeea;color:var(--mute)}
.mv{position:relative}
.mv ul{position:absolute;top:40px;left:0;z-index:5;background:var(--paper);border-radius:10px;box-shadow:0 6px 24px #1c2a2538;padding:6px;list-style:none;min-width:220px;display:none}
.mv.open ul{display:block}
.mv li button{display:flex;gap:10px;align-items:center;width:100%;padding:8px 10px;border-radius:6px;text-align:left}
.mv li button:hover{background:var(--hov)}
.snack{position:fixed;left:24px;bottom:24px;background:#1c2a25;color:#fff;padding:13px 20px;border-radius:8px;opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none;display:flex;gap:20px}
.snack.on{opacity:1;transform:none;pointer-events:auto}.snack button{color:#9ee2c4;font-weight:700}
.prog{height:3px;background:transparent}.prog b{display:block;height:100%;width:0;background:var(--pine)}
@media (max-width:1100px){.main{grid-template-columns:200px 1fr}.read{display:none}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand" id="brand"></div>
    <label class="search"><span id="si"></span><input id="q" placeholder="Search your files" aria-label="Search your files" autocomplete="off"></label>
    <div class="r">
      <div class="seg" role="group" aria-label="Text view"><button id="vr" aria-pressed="true">Redacted</button><button id="vo" aria-pressed="false">Original</button></div>
      <button class="pill" id="idx"></button>
    </div>
  </header>
  <div class="prog" id="prog"><b></b></div>
  <div class="main" style="margin-top:-3px">
    <nav class="side" id="side" aria-label="Folders"></nav>
    <section class="listw">
      <div class="tabs" id="tabs" role="tablist"></div>
      <div class="tools" id="tools"></div>
      <div class="rows" id="rows" role="listbox" aria-label="Files"></div>
    </section>
    <article class="read" id="read" aria-live="polite"></article>
  </div>
</div>
<div class="snack" id="snack"><span></span><button>Undo</button></div>
<script>
const {S,$,$$,icon,esc,FCOL}=KIT;
let nav='all',q='',sel=null,red=true,kind='all';
const reviewed=new Set(),moved={};
const NAV=[['all','All files','tree'],['pii','Sensitive','shield'],['guess','Needs a look','help']];
const fol=f=>S.fById[moved[f.id]||S.primary(f).id];
const unread=f=>S.isGuess(f)&&!reviewed.has(f.id);
$('#brand').innerHTML=icon('tree',26)+'ShadowTree';$('#si').innerHTML=icon('search',20);
$('#idx').innerHTML=icon('refresh',16)+'Index (Read-Only)';

function base(){
  if(q.trim()){const r=KIT.run(q);return {L:r.hits.map(h=>({f:h.f,m:h.match})),weak:r.weak}}
  let F=nav==='all'?S.files:nav==='pii'?S.sensitive():nav==='guess'?S.files.filter(S.isGuess):S.inFolder(nav);
  return {L:F.map(f=>({f,m:Math.round((nav in S.fById?f.links.find(l=>l[0]===nav)[1]:S.score(f))*100)})),weak:0};
}
function side(){
  $('#side').innerHTML=`<button class="compose" id="nf">${icon('plus',22)}New folder</button>`+
  NAV.map(([id,t,ic])=>`<button class="it" data-n="${id}" aria-current="${!q&&nav===id}">${icon(ic,18)}${t}<span class="n">${id==='all'?S.files.length:id==='pii'?S.sensitive().length:S.files.filter(unread).length||''}</span></button>`).join('')+
  `<h3>Folders</h3>`+S.folders.map(f=>`<button class="it" data-n="${f.id}" aria-current="${!q&&nav===f.id}"><i class="dot" style="background:${FCOL[f.id]}"></i>${esc(f.name)}<span class="n">${S.inFolder(f.id).length}</span></button>`).join('')+
  `<div class="disk"><b>Your files haven't moved</b>Folders here are labels. The originals stay in ${esc(S.ROOT)}</div>`;
  $$('#side [data-n]').forEach(b=>b.onclick=()=>{q='';$('#q').value='';nav=b.dataset.n;sel=null;draw()});
  $('#nf').onclick=()=>KIT.toast('Created “New folder”. Sorting your files into it…');
}
function draw(){
  side();
  const b=base();let L=b.L;
  const KS=[['all','All'],['pdf','PDF'],['text','Text'],['image','Images'],['audio','Audio']];
  $('#tabs').innerHTML=KS.map(([k,t])=>`<button role="tab" aria-selected="${kind===k}" data-k="${k}">${t}</button>`).join('');
  $$('#tabs [data-k]').forEach(x=>x.onclick=()=>{kind=x.dataset.k;draw()});
  if(kind!=='all')L=L.filter(r=>r.f.kind===kind);
  if(q.trim())L=L.sort((a,c)=>c.m-a.m);
  $('#tools').innerHTML=`<span class="cb"></span>${icon('chevD',14)}<span class="ic"></span><button aria-label="Refresh" id="rf">${icon('refresh',17)}</button>${icon('more',17)}<span class="cnt">${L.length?`1–${L.length} of ${L.length}`:'0'}${b.weak?` · ${b.weak} weak hidden`:''}</span>`;
  $('#rf').onclick=()=>$('#idx').click();
  $('#rows').innerHTML=L.length?L.map(({f,m})=>{const fo=fol(f);return `<div class="m ${unread(f)?'unread':''}" role="option" tabindex="0" data-id="${f.id}" aria-selected="${sel===f.id}">
   <span class="cb"></span><span class="fr"><i class="dot" style="background:${FCOL[fo.id]}"></i>${esc(fo.short)}</span>
   <span class="sub"><b>${q?KIT.hl(f.title,q):esc(f.title)}</b>${KIT.pii(f)?`<span class="lbl" style="background:var(--pii);margin-left:8px">Personal data</span>`:''}${unread(f)?`<span class="lbl" style="background:#b7791f;margin-left:${KIT.pii(f)?0:8}px">Best guess</span>`:''} – ${esc(f.summary)}</span>
   <span class="t">${q?m+'%':S.size(f.bytes)}</span></div>`}).join(''):`<div class="empty">${q?`Nothing matches “${esc(q)}”.`:'Nothing here yet.'}</div>`;
  $$('#rows .m').forEach(r=>{r.onclick=()=>{sel=+r.dataset.id;draw()};r.onkeydown=e=>{if(e.key==='Enter')r.click()}});
  draw.vis=L.map(r=>r.f.id);
  reader();
}
function reader(){
  const f=sel&&S.byId[sel],p=$('#read');
  if(!f){p.innerHTML=`<div class="empty" style="padding-top:140px">${icon('tree',44)}<br><br>Select a file to read it.<br>Personal data stays covered until you switch to Original.</div>`;return}
  const fo=fol(f);
  p.innerHTML=`<div class="rd"><h1>${esc(f.title)}<span class="lbl">${esc(fo.name)}</span>${KIT.pii(f)?'<span class="lbl" style="background:#fbe0ea;color:var(--pii)">Personal data</span>':''}</h1>
  <div class="who"><div class="av" style="background:${FCOL[fo.id]}">${fo.name[0]}</div><div><b>${esc(fo.name)}</b><span>Filed here with ${S.pct(S.score(f))}% match${f.links.length>1?' · also near '+esc(f.links.slice(1).map(l=>S.fById[l[0]].short).join(', ')):''}</span></div>
   <div class="acts"><button aria-label="Reveal on Disk" id="rv" title="Reveal on Disk">${icon('open',19)}</button><button aria-label="Copy path" id="cp" title="Copy path">${icon('copy',19)}</button></div></div>
  ${unread(f)?`<div class="banner">${icon('help',22)}<div><b>ShadowTree is not sure about this one.</b><br>It is filed in ${esc(fo.name)}, but the match is only ${S.pct(S.score(f))}%.</div><button class="btn" id="ok">Looks right</button><div class="mv" style="flex:none"><button class="btn p" id="mvb">Move to…</button><ul>${S.folders.map(x=>`<li><button data-m="${x.id}"><i class="dot" style="background:${FCOL[x.id]}"></i>${esc(x.name)}</button></li>`).join('')}</ul></div></div>`:''}
  <div class="sum"><small>Summary${f.ai==='fallback'?' (basic, no AI model)':''}</small>${esc(f.summary)}</div>
  <div class="txt">${KIT.body(f,red,q)}</div>
  <div class="tg">${f.tags.map(t=>`<span>${esc(t)}</span>`).join('')}</div>
  <div class="att"><div class="ico">${icon(KIT.kindIcon(f),22)}</div><div><b>${esc(f.name)}</b><span>${S.size(f.bytes)} · original on your disk</span></div><button class="btn" id="rv2">Reveal on Disk</button></div></div>`;
  const rv=()=>KIT.toast('Revealed in Windows Explorer');$('#rv').onclick=rv;$('#rv2').onclick=rv;$('#cp').onclick=()=>KIT.toast('Path copied');
  if($('#ok'))$('#ok').onclick=()=>{reviewed.add(f.id);draw();snack('Marked as reviewed')};
  if($('#mvb')){$('#mvb').onclick=e=>{e.stopPropagation();$('.mv').classList.toggle('open')};$$('[data-m]').forEach(b=>b.onclick=()=>{moved[f.id]=b.dataset.m;reviewed.add(f.id);draw();snack('Moved to '+S.fById[b.dataset.m].name+'. The file on disk did not move.')})}
}
function snack(t){const s=$('#snack');s.firstChild.textContent=t;s.classList.add('on');clearTimeout(snack.h);snack.h=setTimeout(()=>s.classList.remove('on'),4000);s.querySelector('button').onclick=()=>{s.classList.remove('on')}}
$('#q').oninput=e=>{q=e.target.value;sel=null;draw()};
function setRed(v){red=v;$('#vr').setAttribute('aria-pressed',v);$('#vo').setAttribute('aria-pressed',!v);reader()}
$('#vr').onclick=()=>setRed(true);$('#vo').onclick=()=>setRed(false);
$('#idx').onclick=()=>{$('#idx').disabled=true;KIT.scan(v=>$('#prog b').style.width=v*100+'%',()=>{$('#prog b').style.width='0';$('#idx').disabled=false;KIT.toast('Indexed 13 files. Nothing was changed.')})};
addEventListener('click',()=>{const m=$('.mv');m&&m.classList.remove('open')});
addEventListener('keydown',e=>{
  if(e.key==='/'&&document.activeElement!==$('#q')){e.preventDefault();$('#q').focus();return}
  if(document.activeElement===$('#q')){if(e.key==='Escape'){$('#q').blur()}return}
  const v=draw.vis||[];if(!v.length)return;let i=v.indexOf(sel);
  if(e.key==='j'||e.key==='ArrowDown'){e.preventDefault();sel=v[Math.min(v.length-1,i+1)];draw();$(`[data-id="${sel}"]`).scrollIntoView({block:'nearest'})}
  if(e.key==='k'||e.key==='ArrowUp'){e.preventDefault();sel=v[Math.max(0,i-1)];draw();$(`[data-id="${sel}"]`).scrollIntoView({block:'nearest'})}
});
sel=9;draw();
</script>
</body>
</html>
