# Tests and builds on every push and pull request. No model is downloaded: the backend tests mock
# every model and block non-loopback sockets.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Dependency check
        run: python -m pip check
      - name: Tests
        working-directory: backend
        run: python -m pytest -q

  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build

  desktop-shell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile check (Rust, locked dependencies)
        working-directory: frontend/src-tauri
        run: cargo check --locked
