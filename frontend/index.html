<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>ShadowTree: find your files by meaning, never touch them</title>
  <link rel="icon" type="image/png" href="/icon.png">
  <script>
    // Apply the saved theme before first paint so there is no flash.
    try { var t = localStorage.getItem('veilfs-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
<div class="app">
  <header class="toolbar">
    <button id="left-toggle" class="tb-btn" type="button" aria-controls="sidebar" aria-expanded="true" aria-label="Show or hide folders" title="Show or hide folders (Ctrl+B)"></button>
    <div class="tb-brand" title="Virtual folders for your real ones">
      <img class="brand-icon" src="/icon.png" alt="" width="30" height="30">
      <span class="brand-name">ShadowTree</span>
    </div>
    <button id="back" class="tb-btn" type="button" aria-label="Back to All Files" title="Back to All Files" hidden></button>
    <div id="view-head" class="view-head"></div>
    <div class="vs" role="group" aria-label="Layout">
      <button id="v-icons" type="button" aria-label="Icons" title="Icons"></button>
      <button id="v-list" type="button" aria-label="List" title="List"></button>
      <button id="v-gallery" type="button" aria-label="Gallery" title="Gallery"></button>
    </div>
    <div class="tb-right">
      <div id="mode-seg" class="seg" role="group" aria-label="Which version of the text to show">
        <button id="mode-redacted" type="button" aria-pressed="true">Redacted</button>
        <button id="mode-original" type="button" aria-pressed="false">Original</button>
      </div>
      <button id="theme-toggle" class="tb-btn" type="button"></button>
      <button id="info-toggle" class="tb-btn" type="button" aria-controls="drawer" aria-expanded="true" aria-label="Show or hide file details" title="Show or hide file details (Ctrl+Alt+B)"></button>
      <form id="search-form" class="search-form" role="search" autocomplete="off">
        <label class="sr-only" for="q">Search your files</label>
        <input id="q" type="search" placeholder="Search by meaning, e.g. money I spent">
      </form>
    </div>
  </header>

  <aside id="sidebar" class="sidebar" aria-label="Folders">
    <nav id="folder-nav" class="folder-nav"></nav>

    <details id="new-folder-box" class="side-box">
      <summary>New virtual folder</summary>
      <form id="new-folder" class="new-folder" autocomplete="off">
        <p class="hint">Files are sorted into it by meaning. Nothing moves on disk.</p>
        <div class="nf-row">
          <input id="nf-emoji" class="emoji-input" maxlength="4" value="📁" aria-label="Folder emoji" title="Emoji (suggested for you, you can change it)">
          <input id="nf-name" type="text" placeholder="Name, e.g. Travel plans" maxlength="60" required aria-label="Folder name">
        </div>
        <input id="nf-desc" type="text" placeholder="What goes in it? (optional)" maxlength="200" aria-label="Folder description">
        <button class="btn" type="submit">Create folder</button>
        <div id="nf-msg" class="hint" role="status"></div>
      </form>
    </details>

    <form id="scan-form" class="scan-form side-box" autocomplete="off">
      <h2>Folder on disk</h2>
      <button id="pick-btn" class="btn" type="button" title="Open the Windows folder picker">📂 Choose folder…</button>
      <label class="sr-only" for="root">Folder to index</label>
      <input id="root" type="text" placeholder="…or paste a folder path" spellcheck="false">
      <button id="scan-btn" class="btn btn-primary" type="submit">Index (Read-Only)</button>
      <div class="readonly" title="ShadowTree opens your files read-only. It never writes, moves or deletes them.">🔒 Read-only: your files are never modified</div>
      <button id="clear-btn" class="btn btn-small btn-quiet" type="button" title="Delete the text, summaries and search data ShadowTree keeps. Your files are not touched.">Clear index…</button>
    </form>

    <div class="side-foot">
      <a class="credit" href="https://desertant.com" target="_blank" rel="noopener noreferrer">Powered by Desert Ant Labs</a>
    </div>
  </aside>

  <main class="center">
    <section id="progress" class="progress" hidden aria-live="polite">
      <div class="bar"><div id="bar-fill" class="bar-fill"></div></div>
      <div class="progress-row">
        <div id="progress-text" class="progress-text"></div>
        <button id="stop-btn" class="btn btn-small" type="button" title="Stop after the file it is reading. Files read so far stay in the index.">Stop</button>
      </div>
    </section>
    <div id="skipped" class="skipped" hidden></div>
    <div id="notes" class="notes"></div>
    <section id="content" class="content" aria-live="polite"></section>
  </main>

  <aside id="drawer" class="info" aria-label="File details"></aside>
  <div id="quick" class="quick" role="dialog" aria-modal="true" aria-label="Full-size look" hidden></div>
  <div id="toast" class="toast" role="status" hidden></div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
